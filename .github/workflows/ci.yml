name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Validate Assets/Data/Modules
        run: ./build/validate-all.sh

      - name: Headless Smoke Test
        run: dotnet run --project src/Samples/FactoryPlatformer -- --headless --scene headless-demo --script data/scripts/headless-victory.json --min-score 50 --expect-event victory
